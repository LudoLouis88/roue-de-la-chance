<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>La roue de la chance</title>
    <meta name="description" content="Une roue de la chance équitable, avec un tirage unique par participant.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">DÉCIDEZ AU HASARD</p>
        <h1>La roue de la chance</h1>
        <p class="intro" id="subtitle">Un tour, un choix. Bonne chance.</p>
      </header>

      <section id="admin-view" hidden></section>

      <section id="participant-view" hidden>
        <p class="participant-label" id="participant-label"></p>
        <div class="wheel-panel" aria-label="Roue de la chance">
          <div class="pointer" aria-hidden="true"></div>
          <button id="wheel-button" class="wheel-button" type="button" aria-label="Lancer la roue">
            <canvas id="wheel" width="700" height="700" aria-label="Roue de la chance"></canvas>
            <span class="spin-label">LANCER</span>
          </button>
        </div>
        <p id="message" class="message" aria-live="polite"></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
